<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS Seguro</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0514">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #7c3aed;
            --primary-glow: rgba(124, 58, 237, 0.5);
            --secondary: #06b6d4;
            --glass-bg: rgba(10, 5, 25, 0.6);
            --glass-border: rgba(167, 139, 250, 0.18);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #050510;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.3;
            animation: float 10s ease-in-out infinite;
        }
        .orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, #7c3aed, transparent); top: -150px; left: -150px; animation-duration: 9s; }
        .orb-2 { width: 450px; height: 450px; background: radial-gradient(circle, #0891b2, transparent); bottom: -100px; right: -100px; animation-duration: 12s; animation-delay: -4s; }
        .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, #4f46e5, transparent); top: 40%; left: 40%; animation-duration: 15s; animation-delay: -7s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -50px) scale(1.08); }
            66% { transform: translate(-30px, 30px) scale(0.94); }
        }
        .grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background-image: linear-gradient(rgba(124, 58, 237, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(124, 58, 237, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: twinkle 3s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 0.7; transform: scale(1.2); } }
        .container { position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 1rem; }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 0 1px rgba(167,139,250,0.05), 0 24px 64px rgba(0,0,0,0.7), 0 0 100px rgba(124,58,237,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167,139,250,0.6), transparent);
        }
        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-icon {
            width: 76px; height: 76px;
            background: linear-gradient(135deg, #7c3aed, #0891b2);
            border-radius: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 2.2rem; margin-bottom: 1.1rem;
            box-shadow: 0 8px 32px rgba(124,58,237,0.45), 0 0 0 1px rgba(167,139,250,0.25);
            animation: pulse-icon 3s ease-in-out infinite;
        }
        @keyframes pulse-icon {
            0%, 100% { box-shadow: 0 8px 32px rgba(124,58,237,0.45), 0 0 0 1px rgba(167,139,250,0.25); }
            50% { box-shadow: 0 8px 50px rgba(124,58,237,0.75), 0 0 0 1px rgba(167,139,250,0.45), 0 0 70px rgba(6,182,212,0.25); }
        }
        .logo-area h1 {
            font-size: 1.65rem; font-weight: 800;
            background: linear-gradient(135deg, #e2d9f3, #a78bfa, #67e8f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: -0.02em;
        }
        .logo-area p { font-size: 0.82rem; color: #64748b; margin-top: 0.4rem; }
        .input-field {
            width: 100%; padding: 0.95rem 1.2rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(167,139,250,0.15);
            border-radius: 14px; color: white;
            font-size: 0.95rem; font-family: 'Inter', sans-serif;
            outline: none; transition: all 0.3s ease; margin-bottom: 1rem;
        }
        .input-field::placeholder { color: #475569; }
        .input-field:focus {
            border-color: rgba(124,58,237,0.65);
            background: rgba(124,58,237,0.07);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.18), 0 0 24px rgba(124,58,237,0.12);
        }
        .btn {
            width: 100%; padding: 0.95rem 1.5rem; border: none; border-radius: 14px;
            font-size: 0.95rem; font-weight: 700; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.25s ease; position: relative; overflow: hidden;
            letter-spacing: 0.01em; margin-bottom: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; background: rgba(255,255,255,0.15); border-radius: 50%;
            transform: translate(-50%,-50%); transition: width 0.4s, height 0.4s, opacity 0.4s; opacity: 0;
        }
        .btn:active::after { width: 250px; height: 250px; opacity: 1; }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white;
            box-shadow: 0 4px 20px rgba(124,58,237,0.4);
        }
        .btn-primary:hover { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 6px 32px rgba(124,58,237,0.6); transform: translateY(-2px); }
        .btn-scan {
            background: linear-gradient(135deg, #0891b2, #0e7490); color: white;
            box-shadow: 0 4px 20px rgba(6,182,212,0.3);
        }
        .btn-scan:hover { background: linear-gradient(135deg, #06b6d4, #0891b2); box-shadow: 0 6px 32px rgba(6,182,212,0.5); transform: translateY(-2px); }
        .btn-scan.active { background: linear-gradient(135deg, #dc2626, #b91c1c) !important; box-shadow: 0 4px 20px rgba(220,38,38,0.4) !important; }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.1rem 0; }
        .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(167,139,250,0.2), transparent); }
        .divider-text { font-size: 0.72rem; color: #475569; font-weight: 600; letter-spacing: 0.1em; }
        #video-container {
            display: none; margin-top: 0.8rem; position: relative;
            border-radius: 18px; overflow: hidden;
            border: 1px solid rgba(6,182,212,0.35);
            box-shadow: 0 0 40px rgba(6,182,212,0.18);
        }
        video { width: 100%; display: block; }
        canvas { display: none; }
        .scan-laser {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #06b6d4, #a78bfa, #06b6d4, transparent);
            box-shadow: 0 0 12px rgba(6,182,212,0.9), 0 0 30px rgba(6,182,212,0.5);
            animation: laser-scan 2s ease-in-out infinite; display: none;
        }
        @keyframes laser-scan { 0% { top: 0; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { top: calc(100% - 3px); opacity: 0; } }
        .scan-corners { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
        .corner { position: absolute; width: 28px; height: 28px; border-color: #06b6d4; border-style: solid; }
        .corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
        .corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
        .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
        .corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }
        .scan-hint { position: absolute; bottom: 0; left: 0; right: 0; padding: 0.6rem; background: linear-gradient(transparent, rgba(0,0,0,0.75)); font-size: 0.75rem; text-align: center; color: #94a3b8; }
        .error-msg {
            display: none; padding: 0.8rem 1rem;
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
            border-radius: 12px; color: #fca5a5; font-size: 0.85rem; text-align: center;
            margin-top: 0.75rem; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .security-badge {
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 1.5rem; padding: 0.5rem 1rem;
            background: rgba(16,185,129,0.07); border: 1px solid rgba(16,185,129,0.15);
            border-radius: 100px; font-size: 0.7rem; color: #6ee7b7; letter-spacing: 0.05em;
        }
        /* Loading */
        #loading-ui { display: none; text-align: center; }
        .loading-card {
            background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 28px; padding: 3.5rem 2rem;
            box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 0 100px rgba(124,58,237,0.12);
        }
        .hologram { width: 90px; height: 90px; margin: 0 auto 1.75rem; position: relative; }
        .hologram-ring {
            position: absolute; border-radius: 50%; border: 2px solid transparent; animation: spin 2s linear infinite;
        }
        .hologram-ring:nth-child(1) { width: 90px; height: 90px; top: 0; left: 0; border-top-color: #7c3aed; border-right-color: rgba(124,58,237,0.2); }
        .hologram-ring:nth-child(2) { width: 68px; height: 68px; top: 11px; left: 11px; border-top-color: #06b6d4; border-right-color: rgba(6,182,212,0.2); animation-direction: reverse; animation-duration: 1.4s; }
        .hologram-ring:nth-child(3) { width: 46px; height: 46px; top: 22px; left: 22px; border-top-color: #a78bfa; animation-duration: 0.9s; }
        .hologram-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 10px; height: 10px; background: #7c3aed; border-radius: 50%;
            box-shadow: 0 0 14px rgba(124,58,237,0.9); animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-dot {
            0%, 100% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 14px rgba(124,58,237,0.9); }
            50% { transform: translate(-50%,-50%) scale(1.6); box-shadow: 0 0 28px rgba(124,58,237,1), 0 0 50px rgba(6,182,212,0.4); }
        }
        #loading-ui h2 {
            font-size: 1.25rem; font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #67e8f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 0.6rem;
        }
        .loading-dots { color: #475569; font-size: 0.88rem; }
        .loading-dots span { animation: blink 1.4s ease-in-out infinite; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    </style>
</head>

                document.getElementById('login-ui').style.display = 'block';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('key-input').value = '';
                localStorage.removeItem('pos_secure_key');
            }
        }

        const video = document.getElementById("video");
        const canvasEl = document.getElementById("canvas");
        const ctx = canvasEl.getContext("2d", { willReadFrequently: true });
        const btnScan = document.getElementById("btn-scan");
        const videoContainer = document.getElementById("video-container");
        const scanLaser = document.getElementById("scan-laser");
        let scanning = false;

        btnScan.addEventListener("click", () => {
            if (scanning) { stopScan(); return; }
            if (typeof jsQR === 'undefined') { alert("La librería del escáner requiere conexión inicial. Intente de nuevo."); return; }
            document.getElementById('error-msg').style.display = 'none';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
                scanning = true;
                videoContainer.style.display = 'block';
                scanLaser.style.display = 'block';
                btnScan.textContent = "⬛ Detener Escáner";
                btnScan.classList.add('active');
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(tick);
            }).catch(err => { alert("Error al acceder a la cámara: " + err); });
        });

        function stopScan() {
            scanning = false;
            videoContainer.style.display = 'none';
            scanLaser.style.display = 'none';
            btnScan.textContent = "📷 Escanear Código QR";
            btnScan.classList.remove('active');
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(t => t.stop());
        }

        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasEl.height = video.videoHeight;
                canvasEl.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvasEl.width, canvasEl.height);
                const imageData = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code && code.data) {
                    stopScan();
                    document.getElementById('key-input').value = code.data;
                    attemptUnlock(code.data);
                }
            }
            requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
